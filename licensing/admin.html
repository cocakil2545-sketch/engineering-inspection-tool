<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InspectIQ License Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#172019;font:15px Arial,sans-serif}.wrap{max-width:1000px;margin:35px auto;padding:18px}.card{background:white;border:1px solid #dce4df;border-radius:14px;padding:20px;margin:14px 0}h1{margin:0 0 8px}label{display:block;font-weight:bold;font-size:13px;margin:12px 0 5px}input,select{padding:11px;border:1px solid #ccd8d0;border-radius:8px;width:100%;font:inherit}button{background:#23a859;color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:bold;margin-top:14px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.status{font-size:13px;color:#536159;margin-top:10px;white-space:pre-wrap}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:9px;border-bottom:1px solid #e1e8e3;text-align:left;overflow-wrap:anywhere}th{background:#eef4f0}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>InspectIQ License Administration</h1><p>Create customer accounts, issue license terms and review device activations.</p>
<div class="card"><label>Licensing API URL</label><input id="api" placeholder="https://your-worker.workers.dev"><label>Administrator API token</label><input id="token" type="password" placeholder="ADMIN_TOKEN"><button onclick="connect()">Connect</button><div id="status" class="status">Enter your deployed API URL and admin token.</div></div>
<div class="grid"><div class="card"><h3>Create customer</h3><label>Username / email</label><input id="username"><label>Temporary password (minimum 8 characters)</label><input id="password" type="password"><label>Email (optional)</label><input id="email"><button onclick="createCustomer()">Create account</button><div id="customerStatus" class="status"></div></div>
<div class="card"><h3>Issue license</h3><label>Customer username</label><input id="licenseUser"><label>License term</label><select id="plan"><option value="1_YEAR">1 year</option><option value="2_YEAR">2 years</option><option value="3_YEAR">3 years</option><option value="5_YEAR">5 years</option><option value="TRIAL">7-day trial</option></select><button onclick="issueLicense()">Generate license key</button><div id="licenseStatus" class="status"></div></div></div>
<div class="card"><h3>Customer licenses and device activations</h3><button onclick="loadLicenses()">Refresh list</button><div style="overflow:auto"><table><thead><tr><th>Customer</th><th>License key</th><th>Plan</th><th>Status</th><th>Expires</th><th>Device ID</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>
<script>
let api="",token="";
async function call(path,method="GET",body){const r=await fetch(api+path,{method,headers:{"content-type":"application/json","authorization":"Bearer "+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
function connect(){api=document.getElementById("api").value.trim().replace(/\/$/,"");token=document.getElementById("token").value;document.getElementById("status").textContent="Connection settings saved for this page. Use Refresh list to test.";loadLicenses().catch(e=>document.getElementById("status").textContent=e.message)}
async function createCustomer(){try{const d=await call("/api/admin/customers","POST",{username:username.value,password:password.value,email:email.value});customerStatus.textContent="Created account: "+d.username;licenseUser.value=d.username}catch(e){customerStatus.textContent=e.message}}
async function issueLicense(){try{const d=await call("/api/admin/licenses","POST",{username:licenseUser.value,plan:plan.value});licenseStatus.textContent="License key: "+d.licenseKey+"\nExpires: "+new Date(d.expiresAt).toLocaleString();loadLicenses()}catch(e){licenseStatus.textContent=e.message}}
async function loadLicenses(){try{const d=await call("/api/admin/licenses");rows.innerHTML=d.licenses.map(x=>"<tr><td>"+esc(x.username)+"</td><td>"+esc(x.license_key)+"</td><td>"+esc(x.plan)+"</td><td>"+esc(x.status)+"</td><td>"+new Date(x.expires_at).toLocaleDateString()+"</td><td>"+esc(x.device_id||"Not activated")+"</td><td><button onclick=\\"releaseDevice('"+esc(x.license_key)+"')\\">Release device</button> <button onclick=\\"revokeLicense('"+esc(x.license_key)+"')\\">Revoke</button></td></tr>").join("");status.textContent="Loaded "+d.licenses.length+" license records."}catch(e){status.textContent=e.message;throw e}}

async function releaseDevice(key){if(!confirm("Release this license from its current device?"))return;try{const d=await call("/api/admin/activations/release","POST",{licenseKey:key});status.textContent=d.message;loadLicenses()}catch(e){status.textContent=e.message}}
async function revokeLicense(key){if(!confirm("Permanently revoke this license?"))return;try{const d=await call("/api/admin/licenses/revoke","POST",{licenseKey:key});status.textContent=d.message;loadLicenses()}catch(e){status.textContent=e.message}}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
</script></body></html>
